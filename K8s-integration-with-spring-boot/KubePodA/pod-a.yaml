apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-a
  template:
    metadata:
      labels:
        app: pod-a
    spec:
      containers:
        - name: pod-a
          image: pod-a
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pod-a-service
spec:
  type: ClusterIP
  selector:
    app: pod-a
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080